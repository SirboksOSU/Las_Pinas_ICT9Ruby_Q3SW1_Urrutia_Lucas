<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter</title>
    <!-- Bootstrap CSS link -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-KyZXEJ6Hk3uB7l4cb3E4t0t71voGe1x8o1f4fD36YOuQw8tW3yK1mEGPLodNmbN0" crossorigin="anonymous">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: Arial, sans-serif;
        }
        .container {
            margin-top: 50px;
        }
        .card {
            padding: 20px;
            border-radius: 10px;
            background-color: #ffffff;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #343a40;
        }
        .currency-output {
            font-weight: bold;
            font-size: 1.5rem;
        }
        .btn-convert {
            background-color: #007bff;
            color: white;
        }
        .btn-convert:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            <h1 class="text-center">Currency Converter</h1>
            <p class="text-center">Convert 100 Pesos to different currencies using the form below.</p>
            
            <div class="row justify-content-center">
                <div class="col-md-6">
                    <form id="currencyForm">
                        <div class="mb-3">
                            <label for="currencySelect1" class="form-label">Choose the first currency:</label>
                            <select class="form-select" id="currencySelect1" required>
                                <option value="USD">Dollar (USD)</option>
                                <option value="JPY">Yen (JPY)</option>
                                <option value="EUR">Euro (EUR)</option>
                                <option value="GBP">Pound (GBP)</option>
                                <option value="THB">Baht (THB)</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="currencySelect2" class="form-label">Choose the second currency:</label>
                            <select class="form-select" id="currencySelect2" required>
                                <option value="USD">Dollar (USD)</option>
                                <option value="JPY">Yen (JPY)</option>
                                <option value="EUR">Euro (EUR)</option>
                                <option value="GBP">Pound (GBP)</option>
                                <option value="THB">Baht (THB)</option>
                            </select>
                        </div>

                        <button type="button" class="btn btn-convert" onclick="convertCurrency()">Convert</button>
                    </form>

                    <div id="output1" class="currency-output mt-4"></div>
                    <div id="output2" class="currency-output mt-2"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS & jQuery -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- JavaScript for currency conversion -->
    <script>
        // Define exchange rates for conversion (example values)
        const rates = {
            USD: 0.055, // 1 Peso = 0.055 USD
            JPY: 7.46,  // 1 Peso = 7.46 JPY
            EUR: 0.05,  // 1 Peso = 0.05 EUR
            GBP: 0.045, // 1 Peso = 0.045 GBP
            THB: 1.89   // 1 Peso = 1.89 THB
        };

        // JavaScript function to perform the currency conversion
        function convertCurrency() {
            // Get the selected currencies
            let currency1 = document.getElementById("currencySelect1").value;
            let currency2 = document.getElementById("currencySelect2").value;

            // Convert 100 Pesos to the selected currencies
            let amount1 = 100 * rates[currency1];
            let amount2 = 100 * rates[currency2];

            // Display the result on the webpage
            document.getElementById("output1").innerHTML = `100 Pesos = ${amount1.toFixed(2)} ${currency1}`;
            document.getElementById("output2").innerHTML = `100 Pesos = ${amount2.toFixed(2)} ${currency2}`;
        }
    </script>

</body>
</html>
